name: Generate Daily Report

on:
  schedule:
    - cron: "15 13 * * 1-5"
    - cron: "47 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Generate even if today's report already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "daily-report"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'America/Los_Angeles' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether generation is needed
        id: gate
        shell: bash
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          report_date="$(TZ="$REPORT_TIMEZONE" date +%F)"
          report_html="reports/finance-daily-report-${report_date}.html"
          report_md="reports/finance-daily-report-${report_date}.md"
          report_json="reports/finance-daily-report-${report_date}.snapshots.json"

          echo "report_date=${report_date}" >> "$GITHUB_OUTPUT"
          echo "report_html=${report_html}" >> "$GITHUB_OUTPUT"
          echo "report_md=${report_md}" >> "$GITHUB_OUTPUT"
          echo "report_json=${report_json}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_RUN" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Forcing generation for ${report_date}."
            exit 0
          fi

          if [ -f "$report_html" ] && [ -f "$report_md" ] && [ -f "$report_json" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Report for ${report_date} already exists in the repo. Skipping generation."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Report for ${report_date} is missing. Generating now."
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Generate report
        if: steps.gate.outputs.should_run == 'true'
        env:
          REPORT_OUTPUT_DIR: reports
          REPORT_NEWS_LIMIT: ${{ vars.REPORT_NEWS_LIMIT || '12' }}
          REPORT_STOCK_LIMIT: ${{ vars.REPORT_STOCK_LIMIT || '8' }}
          REPORT_WATCHLIST: ${{ vars.REPORT_WATCHLIST || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: python -m finance_daily_report --email-if-configured

      - name: Commit and push report
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.md reports/*.html reports/*.snapshots.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily report for ${{ steps.gate.outputs.report_date }}"
            git push origin HEAD:main
          fi

      - name: Publish report to reports site
        if: ${{ always() && steps.gate.outputs.report_date != '' }}
        shell: bash
        env:
          REPORTS_DEPLOY_KEY: ${{ secrets.REPORTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$REPORTS_DEPLOY_KEY" ]; then
            echo "REPORTS_DEPLOY_KEY is not configured; skipping publish to awolf08/reports."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$REPORTS_DEPLOY_KEY" > ~/.ssh/reports_deploy_key
          chmod 600 ~/.ssh/reports_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          GIT_SSH_COMMAND="ssh -i ~/.ssh/reports_deploy_key -o IdentitiesOnly=yes" git clone git@github.com:awolf08/reports.git reports-site

          report_date="${{ steps.gate.outputs.report_date }}"
          mkdir -p reports-site/daily-finance
          if [ ! -f "reports/finance-daily-report-${report_date}.html" ] || [ ! -f "reports/finance-daily-report-${report_date}.md" ] || [ ! -f "reports/finance-daily-report-${report_date}.snapshots.json" ]; then
            echo "Generated report files for ${report_date} are missing; skipping publish to awolf08/reports."
            exit 1
          fi

          cp "reports/finance-daily-report-${report_date}.html" "reports-site/daily-finance/${report_date}.html"
          cp "reports/finance-daily-report-${report_date}.md" "reports-site/daily-finance/${report_date}.md"
          cp "reports/finance-daily-report-${report_date}.snapshots.json" "reports-site/daily-finance/${report_date}.snapshots.json"
          cat > reports-site/daily-finance/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Daily Finance Report</title>
            <script>
              const date = new Intl.DateTimeFormat("en-CA", {
                timeZone: "America/Los_Angeles",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }).format(new Date());
              location.replace("./" + date + ".html");
            </script>
          </head>
          <body>
            <p>Opening today's Finance Daily Report.</p>
          </body>
          </html>
          EOF

          cd reports-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-finance/
          if git diff --cached --quiet; then
            echo "No reports site changes to commit."
          else
            git commit -m "Publish daily finance report for ${report_date}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/reports_deploy_key -o IdentitiesOnly=yes" git push origin HEAD:main
          fi
