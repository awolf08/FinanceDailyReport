name: Generate Daily Report

on:
  schedule:
    - cron: "5 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-report"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'America/Los_Angeles' }}
          REPORT_OUTPUT_DIR: reports
          REPORT_NEWS_LIMIT: ${{ vars.REPORT_NEWS_LIMIT || '12' }}
          REPORT_STOCK_LIMIT: ${{ vars.REPORT_STOCK_LIMIT || '8' }}
          REPORT_WATCHLIST: ${{ vars.REPORT_WATCHLIST || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: python -m finance_daily_report --email-if-configured

      - name: Commit and push report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.md reports/*.html
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily report for $(date -u +%F)"
            git push origin HEAD:main
          fi

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/reports
          cp reports/*.html _site/reports/
          cp reports/*.md _site/reports/ 2>/dev/null || true
          touch _site/.nojekyll

          latest_report="$(find reports -maxdepth 1 -type f -name 'finance-daily-report-*.html' | sort | tail -n 1)"
          latest_name="$(basename "$latest_report")"

          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Finance Daily Report</title>
            <meta http-equiv="refresh" content="0; url=./reports/${latest_name}">
            <style>
              :root { color-scheme: light; }
              body {
                margin: 0;
                font-family: Georgia, "Times New Roman", serif;
                background: linear-gradient(180deg, #f5f0e8 0%, #fdfbf8 100%);
                color: #1f2937;
              }
              main {
                max-width: 760px;
                margin: 8vh auto;
                padding: 32px 24px;
                background: rgba(255,255,255,0.86);
                border: 1px solid #dccfb8;
                border-radius: 18px;
                box-shadow: 0 16px 50px rgba(64, 45, 21, 0.08);
              }
              h1 { margin-top: 0; font-size: 2rem; }
              a { color: #0f4c5c; }
              p { line-height: 1.6; }
            </style>
          </head>
          <body>
            <main>
              <h1>Finance Daily Report</h1>
              <p>Redirecting to the latest published report:</p>
              <p><a href="./reports/${latest_name}">${latest_name}</a></p>
            </main>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
