name: Generate Daily Report

on:
  schedule:
    - cron: "5 13 * * 1-5"
    - cron: "35 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Generate even if today's report already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-report"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'America/Los_Angeles' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether generation is needed
        id: gate
        shell: bash
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          report_date="$(TZ="$REPORT_TIMEZONE" date +%F)"
          report_html="reports/finance-daily-report-${report_date}.html"
          report_md="reports/finance-daily-report-${report_date}.md"

          echo "report_date=${report_date}" >> "$GITHUB_OUTPUT"
          echo "report_html=${report_html}" >> "$GITHUB_OUTPUT"
          echo "report_md=${report_md}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_RUN" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Forcing generation for ${report_date}."
            exit 0
          fi

          if [ -f "$report_html" ] && [ -f "$report_md" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Report for ${report_date} already exists in the repo. Skipping generation."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Report for ${report_date} is missing. Generating now."
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Generate report
        if: steps.gate.outputs.should_run == 'true'
        env:
          REPORT_OUTPUT_DIR: reports
          REPORT_NEWS_LIMIT: ${{ vars.REPORT_NEWS_LIMIT || '12' }}
          REPORT_STOCK_LIMIT: ${{ vars.REPORT_STOCK_LIMIT || '8' }}
          REPORT_WATCHLIST: ${{ vars.REPORT_WATCHLIST || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: python -m finance_daily_report --email-if-configured

      - name: Commit and push report
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.md reports/*.html
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily report for ${{ steps.gate.outputs.report_date }}"
            git push origin HEAD:main
          fi

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/reports _site/latest
          cp reports/*.html _site/reports/
          cp reports/*.md _site/reports/ 2>/dev/null || true
          touch _site/.nojekyll

          latest_report="$(find reports -maxdepth 1 -type f -name 'finance-daily-report-*.html' | sort | tail -n 1)"
          latest_name="$(basename "$latest_report")"
          cp "$latest_report" _site/latest/index.html

          cat > _site/latest.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Latest Finance Daily Report</title>
            <meta http-equiv="refresh" content="0; url=./latest/">
          </head>
          <body></body>
          </html>
          EOF

          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Finance Daily Report</title>
            <meta http-equiv="refresh" content="0; url=./latest/">
            <style>
              :root { color-scheme: light; }
              body {
                margin: 0;
                font-family: Georgia, "Times New Roman", serif;
                background: linear-gradient(180deg, #f5f0e8 0%, #fdfbf8 100%);
                color: #1f2937;
              }
              main {
                max-width: 760px;
                margin: 8vh auto;
                padding: 32px 24px;
                background: rgba(255,255,255,0.86);
                border: 1px solid #dccfb8;
                border-radius: 18px;
                box-shadow: 0 16px 50px rgba(64, 45, 21, 0.08);
              }
              h1 { margin-top: 0; font-size: 2rem; }
              a { color: #0f4c5c; }
              p { line-height: 1.6; }
            </style>
          </head>
          <body>
            <main>
              <h1>Finance Daily Report</h1>
              <p>Redirecting to the latest published report:</p>
              <p><a href="./latest/">Open latest report</a></p>
              <p>Direct dated file: <a href="./reports/${latest_name}">${latest_name}</a></p>
            </main>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
