name: Sync latest premarket alias
on:
  push:
    branches: [main]
    paths:
      - 'ChatGPT/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-premarket.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest-premarket.md
        shell: bash
        run: |
          set -euo pipefail
          latest_file="$(ls ChatGPT/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-premarket.md | sort | tail -n 1)"
          cp "$latest_file" ChatGPT/latest-premarket.md
          echo "Latest premarket source: $latest_file"
          if git diff --quiet -- ChatGPT/latest-premarket.md; then
            echo "latest-premarket.md is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPT/latest-premarket.md
          git commit -m "Sync latest premarket report"
          git push
